<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 出勤異常偵測系統 (含靈敏度調整)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 30px; }
        .card { border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #333; }
        .setting-group { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #1a73e8; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .threshold-value { color: #d93025; font-weight: bold; font-size: 1.1em; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        input[type="file"] { margin: 15px 0; display: block; }
        #status { padding: 15px; border-radius: 6px; margin: 20px 0; display: none; }
        .success { background-color: #e6f4ea; color: #1e8e3e; display: block !important; }
        .error { background-color: #fce8e6; color: #d93025; display: block !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; font-weight: 600; }
        .anomaly-score { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI 出勤異常偵測系統</h1>

    <div class="card">
        <h3>1. 準備 AI 模型</h3>
        <button id="loadModelBtn">載入標準模型 (JSON)</button>
        <div id="modelStatus"></div>
    </div>

    <div class="card">
        <h3>2. 設定判定靈敏度</h3>
        <div class="setting-group">
            <label for="thresholdRange">判定閥值 (MSE): <span id="thresholdDisplay" class="threshold-value">0.0050</span></label>
            <input type="range" id="thresholdRange" min="0.0001" max="0.02" step="0.0001" value="0.0050">
            <p style="font-size: 0.85em; color: #666; margin-top: 8px;">
                💡 數值越小越<strong>靈敏</strong>（抓出更多微小異常）；數值越大越<strong>寬鬆</strong>（只抓極端異常）。
            </p>
        </div>
    </div>

    <div class="card">
        <h3>3. 上傳待鑑定資料</h3>
        <input type="file" id="xlsxFile" accept=".xlsx, .xls" disabled>
        <button id="scanBtn" disabled>開始鑑定異常紀錄</button>
    </div>

    <div id="status"></div>
    <div id="resultArea" style="display: none;">
        <h3>🚨 偵測到的異常清單</h3>
        <table id="resultTable">
            <thead>
                <tr>
                    <th>員工編號</th>
                    <th>日期</th>
                    <th>上班時刻</th>
                    <th>總工時 (小時)</th>
                    <th>異常分數 (MSE)</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    let globalModel = null;
    let currentThreshold = 0.0050;

    // 更新顯示的閥值數值
    document.getElementById('thresholdRange').addEventListener('input', (e) => {
        currentThreshold = parseFloat(e.target.value);
        document.getElementById('thresholdDisplay').innerText = currentThreshold.toFixed(4);
    });

    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const str = String(timeStr);
        if (!str.includes(':')) return 0;
        const [h, m] = str.split(':').map(Number);
        return h * 60 + m;
    }

    function formatMin(m) {
        return `${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}`;
    }

    // 載入模型
    document.getElementById('loadModelBtn').addEventListener('click', async () => {
        const btn = document.getElementById('loadModelBtn');
        const statusDiv = document.getElementById('modelStatus');
        try {
            btn.disabled = true;
            statusDiv.innerText = "⏳ 載入中...";
            const [configRes, weightsRes] = await Promise.all([
                fetch('./model_config.json'),
                fetch('./model_weights.json')
            ]);
            const config = await configRes.json();
            const weightsData = await weightsRes.json();
            globalModel = await tf.models.modelFromJSON(config);
            const weightTensors = weightsData.map(w => tf.tensor(new Float32Array(w.data), w.shape));
            globalModel.setWeights(weightTensors);
            statusDiv.className = "success";
            statusDiv.innerText = "✅ 模型載入成功！";
            document.getElementById('xlsxFile').disabled = false;
        } catch (err) {
            statusDiv.className = "error";
            statusDiv.innerText = "❌ 失敗: " + err.message;
            btn.disabled = false;
        }
    });

    document.getElementById('xlsxFile').addEventListener('change', (e) => {
        if (e.target.files.length > 0) document.getElementById('scanBtn').disabled = false;
    });

    // 執行鑑定
    document.getElementById('scanBtn').addEventListener('click', () => {
        const file = document.getElementById('xlsxFile').files[0];
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        const resultBody = document.getElementById('resultBody');

        statusDiv.className = "success";
        statusDiv.innerText = "⏳ 鑑定中...";
        resultBody.innerHTML = "";
        resultArea.style.display = "none";

        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            const anomalies = [];
            const temp = {};

            jsonData.forEach(row => {
                const empId = row['員工編號'];
                const date = row['上下班日期'];
                const time = row['上下班時間'];
                const flag = row['上下班標記'];

                if (!empId || !date || !time) return;
                const key = `${empId}_${date}`;
                if (flag === 'I') {
                    temp[key] = timeToMinutes(time);
                } else if (flag === 'O' && temp[key]) {
                    const start = temp[key];
                    const duration = timeToMinutes(time) - start;

                    tf.tidy(() => {
                        const input = tf.tensor2d([[start / 1440, duration / 1440]]);
                        const pred = globalModel.predict(input);
                        const mse = tf.losses.meanSquaredError(input, pred).dataSync()[0];

                        // 使用動態調整的閥值
                        if (mse > currentThreshold) {
                            anomalies.push({
                                id: empId, date, start: formatMin(start),
                                duration: (duration / 60).toFixed(2),
                                mse: mse.toFixed(6)
                            });
                        }
                    });
                    delete temp[key];
                }
            });

            if (anomalies.length > 0) {
                statusDiv.innerText = `鑑定完成，發現 ${anomalies.length} 筆異常。`;
                anomalies.forEach(a => {
                    const tr = resultBody.insertRow();
                    tr.innerHTML = `<td>${a.id}</td><td>${a.date}</td><td>${a.start}</td><td>${a.duration}</td><td class="anomaly-score">${a.mse}</td>`;
                });
                resultArea.style.display = "block";
            } else {
                statusDiv.innerText = "✅ 未發現異常紀錄。";
            }
        };
        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
