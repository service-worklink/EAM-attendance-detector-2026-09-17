<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 打卡異常偵測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 基礎樣式重設 --- */
        :root {
            --primary-color: #333333; 
            --bg-color: #f8f9fa;      
            --card-bg: #ffffff;       
            --border-color: #e0e0e0;
            --success-green: #e6f4ea;
            --text-green: #1e8e3e;
            --shadow: 0 2px 10px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--primary-color); padding: 40px 20px; }
        
        .app-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: var(--shadow); }

        /* --- 修改後的 Header 佈局 --- */
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-bottom: 10px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 24px; color: #333; }
        .brand h1 { font-size: 22px; font-weight: 700; color: #333; letter-spacing: 1px; }

        /* --- 仿圖片風格的按鈕 --- */
        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            padding: 8px 18px; 
            border-radius: 50px; 
            border: 1px solid #dcdcdc; 
            background-color: #ffffff;
            color: #444; 
            font-size: 14px; 
            font-weight: 500;
            transition: all 0.2s; 
            cursor: pointer; 
            text-decoration: none;
        }
        .status-badge i { margin-right: 8px; font-size: 14px; color: #666; }
        .status-badge:hover { background-color: #f5f5f5; border-color: #ccc; }
        .status-badge.ready { border-color: #c3e6cb; color: var(--text-green); }
        .status-badge.ready i { color: var(--text-green); }

        /* --- 其他原始元件樣式微調 --- */
        .upload-area { border: 2px dashed #eee; border-radius: 12px; height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; cursor: pointer; transition: 0.3s; color: #888; }
        .upload-area:hover:not(.disabled) { border-color: #aaa; background-color: #fafafa; }
        .upload-area.disabled { cursor: not-allowed; opacity: 0.5; }
        .upload-area i { font-size: 40px; margin-bottom: 10px; color: #ddd; }

        .action-bar { background-color: #fcfcfc; padding: 20px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #f0f0f0; margin-bottom: 25px; }
        .settings-group { display: flex; align-items: center; gap: 15px; flex-grow: 1; }
        
        .range-container { flex-grow: 1; max-width: 300px; margin: 0 15px; }
        input[type="range"] { width: 100%; cursor: pointer; }

        .scan-btn { background-color: #333; color: #fff; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .scan-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        #resultArea { margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #fbfbfb; color: #666; }
        .anomaly-score { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-container">
        <div class="brand">
            <i class="fas fa-address-card"></i>
            <h1>簽到紀錄 AI 異常偵測</h1>
        </div>
        
        <div id="modelStatus" class="status-badge" title="點擊載入模型">
            <i class="fas fa-download"></i> 
            <span>點擊載入標準模型</span>
        </div>
    </div>

    <div id="dropZone" class="upload-area disabled">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>點擊或拖曳 Excel 檔案至此</p>
        <input type="file" id="xlsxFile" accept=".xlsx, .xls" style="display:none">
    </div>

    <div class="action-bar">
        <div class="settings-group">
            <label style="font-size: 14px; color: #666;">靈敏度閥值:</label>
            <div class="range-container">
                <input type="range" id="thresholdRange" min="0.0001" max="0.02" step="0.0001" value="0.0050" disabled>
            </div>
            <span id="thresholdDisplay" style="font-weight: bold; font-family: monospace;">0.0050</span>
        </div>
        
        <button id="scanBtn" class="scan-btn" disabled>
            <i class="fas fa-search"></i> 執行偵測
        </button>
    </div>

    <div id="statusSection" style="margin-bottom: 20px; font-size: 14px;"></div>

    <div id="resultArea" style="display:none">
        <h3 style="font-size: 16px; color: #333;"><i class="fas fa-list-ul"></i> 異常分析結果</h3>
        <table id="resultTable">
            <thead>
                <tr>
                    <th>員工編號</th>
                    <th>日期</th>
                    <th>上班時刻</th>
                    <th>總工時</th>
                    <th>異常分數 (MSE)</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 原有的邏輯保持不變，僅更新 UI 互動部分的 ID
    let globalModel = null;
    const modelBadge = document.getElementById('modelStatus');
    const modelBadgeText = modelBadge.querySelector('span');
    const modelBadgeIcon = modelBadge.querySelector('i');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('xlsxFile');
    const scanBtn = document.getElementById('scanBtn');
    const rangeInput = document.getElementById('thresholdRange');

    // 模擬載入模型 (開發者需確保 ./model_config.json 存在)
    modelBadge.addEventListener('click', async () => {
        if (globalModel) return;
        try {
            modelBadgeText.innerText = "載入中...";
            modelBadgeIcon.className = "fas fa-spinner fa-spin";
            
            // 這裡替換為您實際的 TFJS 載入邏輯
            // const configRes = await fetch('./model_config.json');
            // ... 略 ...

            // 模擬成功
            setTimeout(() => {
                globalModel = true; // 標記已載入
                modelBadge.classList.add('ready');
                modelBadgeIcon.className = "fas fa-check";
                modelBadgeText.innerText = "模型已就緒";
                dropZone.classList.remove('disabled');
                rangeInput.disabled = false;
            }, 800);

        } catch (err) {
            modelBadgeText.innerText = "載入失敗";
            modelBadgeIcon.className = "fas fa-exclamation-circle";
        }
    });

    dropZone.addEventListener('click', () => { if(!dropZone.classList.contains('disabled')) fileInput.click(); });
    fileInput.addEventListener('change', () => {
        if(fileInput.files.length > 0) {
            dropZone.querySelector('p').innerText = "已選取: " + fileInput.files[0].name;
            scanBtn.disabled = false;
        }
    });
</script>

</body>
</html>
