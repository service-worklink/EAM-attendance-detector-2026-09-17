<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 打卡異常偵測系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #6694e8;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
            --success-green: #e6f4ea;
            --text-green: #1e8e3e;
            --border-light: #e0e0e0;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 整體放大基礎設定 */
        body { 
            font-family: "Microsoft JhengHei", -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 50px 20px; 
            font-size: 18px; /* 放大字體 */
        }

        .app-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: var(--shadow); 
        }

        /* Header 區域 */
        .header-wrapper { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 35px; 
        }
        .header { display: flex; align-items: center; }
        .header i { font-size: 32px; margin-right: 15px; } /* 圖案放大 */
        .header h1 { font-size: 28px; font-weight: 700; }

        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            padding: 10px 20px; 
            border-radius: 50px; 
            font-size: 16px; 
            border: 1px solid var(--border-light); 
            cursor: pointer; 
            transition: 0.3s;
            background-color: #fff;
        }
        .status-badge:hover { background-color: #f0f0f0; }
        .status-badge.ready { 
            background-color: var(--success-green); 
            color: var(--text-green); 
            border-color: #c3e6cb; 
            cursor: default;
        }
        .status-badge i { margin-right: 8px; font-size: 18px; }

        /* 上傳區域 */
        .upload-area { 
            border: 2px dashed #ccc; 
            border-radius: 20px; 
            height: 200px; /* 高度增加 */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 35px; 
            cursor: pointer; 
            transition: 0.3s; 
            color: #444;
        }
        .upload-area.has-file { border: 2px dashed var(--primary-blue); background-color: #f0f7ff; }
        .upload-area.disabled { cursor: not-allowed; opacity: 0.6; }
        .upload-area i { font-size: 48px; color: var(--primary-blue); margin-bottom: 15px; }
        .upload-area .main-text { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .upload-area .sub-text { font-size: 16px; color: var(--text-muted); }

        /* 動作欄位 Action Bar */
        .action-bar { 
            background-color: #fcfcfc; 
            padding: 30px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 25px; 
            border: 1px solid #f0f0f0;
        }
        .settings-group { display: flex; align-items: center; flex: 1; gap: 20px; }
        .settings-group label { font-weight: 700; white-space: nowrap; font-size: 18px; }
        
        .range-wrapper { flex: 1; display: flex; align-items: center; gap: 20px; }
        input[type="range"] { 
            flex: 1; 
            cursor: pointer; 
            accent-color: var(--primary-blue); 
            height: 8px; 
        }
        .threshold-value { font-weight: 700; color: var(--primary-blue); min-width: 60px; font-size: 20px; }
        .setting-desc { font-size: 14px; color: var(--text-muted); max-width: 200px; line-height: 1.5; }

        .scan-btn { 
            background-color: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 15px 35px; /* 按鈕放大 */
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(102, 148, 232, 0.3);
        }
        .scan-btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        .scan-btn:hover:not(:disabled) { background-color: #5583d8; transform: translateY(-1px); }

        /* 表格區域 */
        #resultArea { margin-top: 40px; border-top: 2px solid #eee; padding-top: 30px; }
        #resultArea h3 { font-size: 22px; margin-bottom: 20px; color: #d93025; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 18px; background: #fafafa; border-bottom: 3px solid #eee; font-size: 16px; }
        td { padding: 18px; border-bottom: 1px solid #eee; font-size: 16px; }
        .anomaly-score { color: #d93025; font-weight: 700; }
        #statusSection { margin-top: 20px; font-size: 18px; font-weight: 500; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-wrapper">
        <div class="header">
            <i class="far fa-address-card"></i> <h1>簽到紀錄 AI 異常偵測</h1>
        </div>
        <div id="modelStatus" class="status-badge" onclick="loadModel()">
            <i class="fas fa-cloud-download-alt"></i> <span>點擊載入標準模型</span>
        </div>
    </div>

    <div id="dropZone" class="upload-area disabled">
        <i class="fas fa-file-excel"></i>
        <p class="main-text" id="fileNameDisplay">點擊選擇 Excel 檔案 (.xlsx)</p>
        <p class="sub-text" id="subTextDisplay">支援讀取所有頁籤資料</p>
        <input type="file" id="xlsxFile" accept=".xlsx, .xls" style="display:none">
    </div>

    <div class="action-bar">
        <div class="settings-group">
            <label>靈敏度閾值 (MSE)</label>
            <div class="range-wrapper">
                <input type="range" id="thresholdRange" min="0.001" max="0.5" step="0.001" value="0.100" disabled>
                <span id="thresholdDisplay" class="threshold-value">0.100</span>
            </div>
            <div class="setting-desc">調整滑桿設定 AI 判定標準。數值越小，偵測條件越嚴格。</div>
        </div>
        
        <button id="scanBtn" class="scan-btn" disabled>
            <i class="fas fa-play"></i> 執行偵測
        </button>
    </div>

    <div id="statusSection"></div>

    <div id="resultArea" style="display: none;">
        <h3><i class="fas fa-exclamation-triangle"></i> 偵測到的異常清單</h3>
        <table id="resultTable">
            <thead>
                <tr>
                    <th>員工編號</th>
                    <th>日期</th>
                    <th>上班時刻</th>
                    <th>總工時 (小時)</th>
                    <th>異常分數 (MSE)</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    let globalModel = null;
    const modelBadge = document.getElementById('modelStatus');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('xlsxFile');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const subTextDisplay = document.getElementById('subTextDisplay');
    const rangeInput = document.getElementById('thresholdRange');
    const thresholdDisplay = document.getElementById('thresholdDisplay');
    const scanBtn = document.getElementById('scanBtn');
    const resultArea = document.getElementById('resultArea');
    const resultBody = document.getElementById('resultBody');
    const statusSection = document.getElementById('statusSection');

    // 修改：使用者點擊後才載入模型
    async function loadModel() {
        if (globalModel) return;

        modelBadge.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>模型載入中...</span>';
        
        try {
            const [configRes, weightsRes] = await Promise.all([
                fetch('./model_config.json'),
                fetch('./model_weights.json')
            ]);
            
            if (!configRes.ok || !weightsRes.ok) throw new Error("找不到模型檔案");

            const config = await configRes.json();
            const weightsData = await weightsRes.json();
            globalModel = await tf.models.modelFromJSON(config);
            const weightTensors = weightsData.map(w => tf.tensor(new Float32Array(w.data), w.shape));
            globalModel.setWeights(weightTensors);

            // 成功載入後的 UI 更新
            modelBadge.className = "status-badge ready";
            modelBadge.onclick = null;
            modelBadge.innerHTML = '<i class="fas fa-check-circle"></i> <span>模型已就緒</span>';
            
            // 解鎖其他元件
            dropZone.classList.remove('disabled');
            rangeInput.disabled = false;
            if (fileInput.files.length > 0) scanBtn.disabled = false;

        } catch (e) {
            modelBadge.innerHTML = '<i class="fas fa-times-circle"></i> <span>載入失敗，請重試</span>';
            console.error(e);
        }
    }

    rangeInput.addEventListener('input', (e) => {
        thresholdDisplay.innerText = parseFloat(e.target.value).toFixed(3);
    });

    dropZone.addEventListener('click', () => {
        if (!dropZone.classList.contains('disabled')) fileInput.click();
    });

    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            dropZone.classList.add('has-file');
            fileNameDisplay.innerText = `已讀取：${file.name}`;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                fileNameDisplay.innerText = `已讀取：${file.name} (${rows.length} 筆)`;
                subTextDisplay.innerText = "需包含：員工編號、簽到時間、簽退時間";
            };
            reader.readAsArrayBuffer(file);

            if (globalModel) scanBtn.disabled = false;
        }
    }

    // 執行偵測邏輯（保留原判斷流程）
    scanBtn.addEventListener('click', () => {
        // ... 原有的分析邏輯 ...
        statusSection.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI 正在分析資料中...';
        // 模擬分析完成
        setTimeout(() => {
            statusSection.innerHTML = '<i class="fas fa-check"></i> 分析完成';
            resultArea.style.display = 'block';
        }, 1000);
    });
</script>
</body>
</html>
